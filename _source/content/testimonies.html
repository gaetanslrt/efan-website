<h2>End-of-year survey: what parents and students think</h2>
<h3>Methodology</h3>
<p>An end-of-year survey was conducted online and anonymously, from June 23 to July 6, 2025, among all FASN parents and students. The results below cover the 2024-2025 school year.</p>
<figure class="media"><img alt="2024-2025 survey results. Parents: 100% recommend FASN; more than 90% feel FASN made their child’s schooling easier; 90% rate the administrative support as very relevant or satisfactory; 100% rate their relationship with the teaching team as satisfactory or exceptional. Students: more than 90% found the year enriching or exciting; 90% feel they have a good relationship with their FASN teachers; 78% find the workload reasonable, 15% find it too heavy and 7% found the year difficult." height="992" loading="lazy" src="/media/illustrations/survey-2024-2025.png" width="1063"/></figure>
